version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gestao_postgres
    restart: always
    environment:
      POSTGRES_DB: gestao_db
      POSTGRES_USER: gestao_user
      POSTGRES_PASSWORD: gestao_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
