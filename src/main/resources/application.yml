spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:postgresql://localhost:5432/gestao_db
    username: gestao_user
    password: gestao_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: U2VjcmV0S2V5UGFyYUFwaUdlc3Rhb0VtcHJlc2FzMjAyNjEyMzQ1Njc4OTA=
  expiration: 86400000 # 24 horas
